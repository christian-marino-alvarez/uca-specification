name: Publish UCA Core to GitHub Packages

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/core/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@christian-marino-alvarez'

      - name: Install dependencies
        run: npm ci

      - name: Build Core
        run: npm run build -w src/core

      - name: Publish to GitHub Packages
        run: npm publish -w src/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

