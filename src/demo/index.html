<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UCA Application — Input & Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080d1a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
      gap: 2rem;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* ── App container holding pure UCA WebComponents ── */
    #app-container {
      width: 100%;
      max-width: 680px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      min-height: 180px;
      transition: all 0.4s ease;
    }

    .app-toolbar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-toolbar.centered {
      padding: 1.5rem 0;
      justify-content: center;
    }

    .app-toolbar.top {
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #1e293b;
    }

    .app-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Custom elements rendered by UCA Capabilities ── */
    ext-input {
      display: block;
      flex: 1;
      min-height: 48px;
      line-height: 48px;
      padding: 0 1.25rem;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #090e17;
      color: #f8fafc;
      font-size: 15px;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    ext-input:focus, ext-input:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    ext-input:empty::before {
      content: attr(placeholder);
      color: #64748b;
      pointer-events: none;
    }

    ext-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 1.8rem;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      white-space: nowrap;
    }

    ext-action:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    ext-action:active {
      transform: translateY(0);
    }

    ext-box {
      display: block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
      color: #f1f5f9;
      font-size: 15px;
      line-height: 1.5;
    }

    ext-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: #131d31;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      color: #cbd5e1;
    }

    ext-choice {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: #1e293b;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 14px;
    }

    ext-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      color: #94a3b8;
    }

    ext-picture {
      display: block;
      border-radius: 12px;
      overflow: hidden;
      max-width: 100%;
    }

    /* ── Feedback status ── */
    #status-display {
      font-size: 0.85rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* ── UCA Nervous Bus log panel ── */
    #log-panel {
      width: 100%;
      max-width: 620px;
      background: #090e17;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1rem;
      max-height: 220px;
      overflow-y: auto;
      font-family: 'Fira Code', monospace;
      font-size: 0.72rem;
    }

    #log-panel h3 {
      color: #475569;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.6rem;
    }

    .log-entry {
      padding: 0.2rem 0;
      border-bottom: 1px solid #131b2e;
      display: flex;
      gap: 0.6rem;
    }

    .log-source { color: #818cf8; min-width: 90px; }
    .log-signal { color: #38bdf8; min-width: 150px; font-weight: 500; }
    .log-value  { color: #64748b; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

  <header>
    <h1>UCA Application</h1>
    <p>Unidad Cognitiva Autónoma (UCA) fractal y reactiva</p>
  </header>

  <!-- App UCA renders here -->
  <div id="app-container"></div>

  <div id="status-display">⚡ Sistema nervioso activo — Esperando interacción</div>

  <!-- Bus log -->
  <div id="log-panel">
    <h3>🔌 UCA Nervous Bus Telemetry</h3>
  </div>

  <script type="module">
    import { App, SignalType } from './app.bundle.js';

    const bus = new EventTarget();
    const appContainer = document.getElementById('app-container');
    const statusDisplay = document.getElementById('status-display');
    const logPanel = document.getElementById('log-panel');

    function logSignal(signal) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const val = signal.value !== undefined ? JSON.stringify(signal.value).slice(0, 90) : '';
      entry.innerHTML =
        `<span class="log-source">${signal.source ?? '?'}</span>` +
        `<span class="log-signal">${signal.property}</span>` +
        `<span class="log-value">${val}</span>`;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    // Monitor all signals on the bus (filter out internal '*' wildcard dispatch clone)
    const originalDispatch = bus.dispatchEvent.bind(bus);
    bus.dispatchEvent = function(event) {
      if (event?.type !== '*' && event?.detail) { logSignal(event.detail); }
      return originalDispatch(event);
    };

    // Instantiate and innervate the pure App UCA
    const app = new App('web-app');
    app.innervate(bus);

    // Listen for App domain events
    bus.addEventListener(SignalType.READY, () => {
      statusDisplay.textContent = '✅ App lista e inicializada';
      // Iniciar ejecución de la app
      bus.dispatchEvent(new CustomEvent(SignalType.START, {
        detail: { source: 'browser', property: SignalType.START, value: {}, timestamp: Date.now() }
      }));
    });

    bus.addEventListener(SignalType.STARTED, () => {
      statusDisplay.textContent = '🚀 App en ejecución activa';
    });

    bus.addEventListener(SignalType.STOPPED, () => {
      statusDisplay.textContent = '⏹ App detenida';
    });

    // Inicializar App
    bus.dispatchEvent(new CustomEvent(SignalType.INIT, {
      detail: { source: 'browser', property: SignalType.INIT, value: {}, timestamp: Date.now() }
    }));
  </script>
</body>
</html>
