<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UCA Demo — Extensio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Google Sans', 'Roboto', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem 2rem;
      gap: 2rem;
    }

    header { text-align: center; }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    header p { margin-top: 0.5rem; color: #94a3b8; font-size: 0.9rem; }

    /* ── Prompt form ── */
    #prompt-form {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    #prompt-form label {
      font-size: 0.8rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    #prompt-input {
      width: 100%;
      padding: 0.85rem 1.2rem;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #prompt-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
    }
    #prompt-input::placeholder { color: #475569; }

    #generate-btn {
      align-self: flex-end;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #generate-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    #generate-btn:active:not(:disabled) { transform: translateY(0); }
    #generate-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Status badge ── */
    #status-badge {
      font-size: 0.75rem;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      background: #1e3a5f;
      color: #38bdf8;
      border: 1px solid #0ea5e9;
      transition: all 0.3s;
      align-self: center;
    }

    /* ── App output container ── */
    #app-container {
      width: 100%;
      max-width: 640px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      min-height: 140px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    /* ── Rendered search UI ── */
    .search-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }
    .search-input {
      width: 100%;
      max-width: 500px;
      padding: 0.85rem 1.4rem;
      border-radius: 28px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }
    .search-input::placeholder { color: #64748b; }
    .search-button {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #fff;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    .search-button:hover { opacity: 0.9; transform: translateY(-1px); }

    /* ── Bus log panel ── */
    #log-panel {
      width: 100%;
      max-width: 640px;
      background: #0a0f1a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.71rem;
    }
    #log-panel h3 {
      color: #334155;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .log-entry {
      padding: 0.18rem 0;
      border-bottom: 1px solid #0f172a;
      display: flex;
      gap: 0.5rem;
      animation: fadeIn 0.15s ease-in;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; } }
    .log-source { color: #6366f1; min-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-signal  { color: #38bdf8; min-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-value   { color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  </style>
</head>
<body>

  <header>
    <h1>UCA Demo</h1>
    <p>Universal Cognitive Architecture — reactive, fractal, deterministic</p>
  </header>

  <!-- User prompt form -->
  <form id="prompt-form" onsubmit="return false">
    <label for="prompt-input">Describe the app you want to generate</label>
    <textarea
      id="prompt-input"
      placeholder="e.g. A Google-style search interface with an input field and a search button"
    ></textarea>
    <button id="generate-btn" type="submit">
      <span id="btn-icon">✨</span>
      <span id="btn-label">Generate</span>
    </button>
  </form>

  <span id="status-badge">⏳ Initializing…</span>

  <!-- App renders here -->
  <div id="app-container"></div>

  <!-- Bus signal log -->
  <div id="log-panel">
    <h3>🔌 UCA Bus Log</h3>
  </div>

  <script type="module">
    import { App, SignalType } from './app.bundle.js';

    // ─── Shared bus ────────────────────────────────────────────────────────────
    const bus = new EventTarget();

    // ─── Bus log panel ─────────────────────────────────────────────────────────
    const logPanel  = document.getElementById('log-panel');
    const statusBadge = document.getElementById('status-badge');
    const appContainer = document.getElementById('app-container');
    const generateBtn  = document.getElementById('generate-btn');
    const btnLabel     = document.getElementById('btn-label');
    const btnIcon      = document.getElementById('btn-icon');
    const promptInput  = document.getElementById('prompt-input');

    function addLogEntry(signal) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const valueStr = signal.value === undefined ? '' : JSON.stringify(signal.value).slice(0, 100);
      entry.innerHTML =
        `<span class="log-source">${signal.source ?? '?'}</span>` +
        `<span class="log-signal">${signal.property}</span>` +
        `<span class="log-value">${valueStr}</span>`;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    bus.addEventListener('*', (event) => {
      const { detail: signal } = event;
      if (signal) addLogEntry(signal);
    });

    function setStatus(text, bg, fg, border) {
      statusBadge.textContent = text;
      statusBadge.style.background = bg;
      statusBadge.style.color = fg;
      statusBadge.style.borderColor = border;
    }

    function setGenerating(on) {
      generateBtn.disabled = on;
      btnIcon.textContent   = on ? '⏳' : '✨';
      btnLabel.textContent  = on ? 'Generating…' : 'Generate';
    }

    // ─── App UCA ───────────────────────────────────────────────────────────────
    const app = new App('demo-app');
    app.innervate(bus);

    bus.addEventListener(SignalType.READY, () => {
      setStatus('✅ Ready', '#14532d', '#86efac', '#22c55e');
    });

    bus.addEventListener(SignalType.ERROR, (event) => {
      const { detail: signal } = event;
      setStatus(`❌ ${signal?.value}`, '#450a0a', '#fca5a5', '#ef4444');
      setGenerating(false);
    });

    bus.addEventListener(SignalType.RENDERED, (event) => {
      const { detail: signal } = event;
      console.log('[RENDERED]', signal?.value);
      setStatus('🎨 Rendered', '#1e3a5f', '#38bdf8', '#0ea5e9');
      setGenerating(false);
    });

    // ─── Init ──────────────────────────────────────────────────────────────────
    bus.dispatchEvent(new CustomEvent(SignalType.INIT, {
      detail: { source: 'demo', property: SignalType.INIT, value: undefined, timestamp: Date.now() }
    }));

    // ─── Generate on button click ──────────────────────────────────────────────
    document.getElementById('prompt-form').addEventListener('submit', () => {
      const description = promptInput.value.trim() || 'Interactive search application';
      setGenerating(true);
      setStatus('🔄 Generating…', '#1c1917', '#fbbf24', '#f59e0b');

      bus.dispatchEvent(new CustomEvent(SignalType.GENERATE, {
        detail: {
          source: 'demo',
          property: SignalType.GENERATE,
          value: { description, container: appContainer },
          timestamp: Date.now()
        }
      }));
    });
  </script>
</body>
</html>
