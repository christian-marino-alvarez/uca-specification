<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UCA Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080d1a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    #app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    ext-box, .center-layout {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    ext-input {
      display: block;
      flex: 1;
      height: 52px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      padding: 0 1.25rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    ext-input:focus, ext-input:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    ext-input input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    ext-input input::placeholder {
      color: #64748b;
    }

    ext-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      padding: 0 1.8rem;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      white-space: nowrap;
    }

    ext-action:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    ext-action:active {
      transform: translateY(0);
    }

    ext-action.loading {
      opacity: 0.7;
      cursor: wait;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <ext-box id="center-container" class="center-layout">
      <ext-input id="query-input">
        <input id="query-field" type="text" placeholder="que quieres conocer de la Uca" autocomplete="off" />
      </ext-input>
      <ext-action id="query-button" role="button">Consultar</ext-action>
    </ext-box>
  </div>

  <script type="module">
    import { App, Box, Input, Action, SignalType } from './app.bundle.js';

    const bus = new EventTarget();
    const queryField = document.getElementById('query-field');
    const queryButton = document.getElementById('query-button');

    const urlKey = new URLSearchParams(window.location.search).get('jevKey');
    const jevKey = urlKey || localStorage.getItem('JEV_API_KEY') || 'apikey_2220a5e11f50f7bf4fde86f23310761f00a3_10f29eeebad6c43b37c5c538cc0718cd6badba05ec7c3af37eac6f7bc0ec3d92';
    if (jevKey) {
      localStorage.setItem('JEV_API_KEY', jevKey);
    }

    // Instanciar e inervar UCAs
    const app = new App('main-app');
    const container = new Box('center-container');
    const inputUca = new Input('query-input');
    const buttonUca = new Action('query-button');

    container.innervate(bus);
    inputUca.innervate(bus);
    buttonUca.innervate(bus);
    app.innervate(bus);

    function triggerInquiry() {
      const query = queryField.value.trim();
      if (!query) { return; }
      queryButton.classList.add('loading');
      queryButton.textContent = 'Pensando...';
      bus.dispatchEvent(new CustomEvent(SignalType.VIEW_COMPOSE, {
        detail: {
          source: 'user-inquiry',
          property: SignalType.VIEW_COMPOSE,
          value: { request: query },
          timestamp: Date.now()
        }
      }));
    }

    queryButton.addEventListener('click', triggerInquiry);
    queryField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { triggerInquiry(); }
    });

    bus.addEventListener(SignalType.VIEW_COMPOSED, () => {
      queryButton.classList.remove('loading');
      queryButton.textContent = 'Consultar';
    });

    // Iniciar con la necesidad de crear la vista
    bus.dispatchEvent(new CustomEvent(SignalType.JEV_CONNECT, {
      detail: { source: 'init', property: SignalType.JEV_CONNECT, value: { apiKey: jevKey }, timestamp: Date.now() }
    }));

    bus.dispatchEvent(new CustomEvent(SignalType.INIT, {
      detail: {
        source: 'browser',
        property: SignalType.INIT,
        value: {
          request: 'Crear una vista con un único input y un botón centrados en el medio de la página y que ponga en placeholder: que quieres conocer de la Uca'
        },
        timestamp: Date.now()
      }
    }));
  </script>
</body>
</html>
