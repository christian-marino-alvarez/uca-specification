<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCA — Universal Cognitive Architecture</title>
    <meta name="description" content="UCA is a reactive, fractal, and deterministic cognitive architecture for building autonomous agents from composable primitives.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
{{IMPORT_MAP}}
    </script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(48, 54, 61, 0.8);
            --text-color: #e6edf3;
            --accent-cyan: #58a6ff;
        }
        body {
            margin: 0;
            padding: 32px 24px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        ext-app, [id="view"] {
            display: block;
            width: 100%;
            max-width: 820px;
            padding: 20px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-color);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }
        ext-action, [id="action:generate"] {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 18px 0;
            padding: 14px 28px;
            background: linear-gradient(135deg, #1f6feb 0%, #238636 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-user-select: none;
            user-select: none;
        }
        ext-action[disabled], ext-action.disabled {
            background: #21262d !important;
            color: #8b949e !important;
            cursor: not-allowed !important;
            border-color: #30363d !important;
            box-shadow: none !important;
            pointer-events: none;
        }
        ext-action:not([disabled]):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(35, 134, 54, 0.5);
            filter: brightness(1.1);
        }
        ext-action:not([disabled]):active {
            transform: translateY(0);
        }
        ext-box, [id^="box:"] {
            display: block;
            width: 100%;
            max-width: 820px;
            margin-top: 14px;
            padding: 16px 20px;
            background: rgba(22, 27, 34, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #c9d1d9;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>
    <script type="module" src="app.js"></script>
</body>
</html>
