<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCA — Universal Cognitive Architecture</title>
    <meta name="description" content="UCA is a reactive, fractal, and deterministic cognitive architecture for building autonomous agents from composable primitives.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="importmap">
{{IMPORT_MAP}}
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #090d16;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        [hidden] { display: none !important; }

        /* UCA Web Components Base Layout */
        ext-box, ext-collector {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        #root {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1120px;
            gap: 2rem;
            animation: fadeIn 0.4s ease-out;
        }

        /* Header */
        #header {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.75rem;
            background: rgba(15, 23, 42, 0.65);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            gap: 1.5rem;
        }
        #site_title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 40%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #main_nav {
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            align-items: center;
        }

        /* Hero */
        #hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 4.5rem 2rem;
            background: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.15), transparent 70%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 28px;
            gap: 1.25rem;
        }
        #hero_heading, [id*="heading"]:not([id*="section"]) {
            font-size: 2.75rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        #hero_description {
            font-size: 1.15rem;
            color: #94a3b8;
            max-width: 650px;
            line-height: 1.6;
        }

        /* Grid / Main Content */
        #main_content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        [id^="section_"], .card-box {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.75rem;
            background: rgba(15, 23, 42, 0.55);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s;
        }
        [id^="section_"]:hover, .card-box:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.35);
        }
        [id^="heading_"] {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f8fafc;
        }

        /* Action (Buttons) */
        ext-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 2rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: #041019;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.3);
            text-decoration: none;
            -webkit-user-select: none;
            user-select: none;
        }
        ext-action:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.55);
            filter: brightness(1.1);
        }
        ext-action:active {
            transform: translateY(0) scale(0.98);
        }

        /* Access (Links) */
        ext-access {
            display: inline-flex;
            align-items: center;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s ease;
            text-decoration: none;
        }
        ext-access:hover {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* Lists */
        ext-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* Footer */
        #footer {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 2rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <script type="module" src="app.js"></script>
</body>
</html>
