<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Cognitive Architecture (UCA)</title>
    <meta name="description" content="UCA — Universal Cognitive Architecture: Primitivas ontológicas autónomas, reactivas y fractales.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="importmap">
{{IMPORT_MAP}}
    </script>
    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: rgba(18, 20, 26, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f0f6fc;
            --muted-color: #8b949e;
            --accent-color: #58a6ff;
            --accent-green: #238636;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .uca-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        #box\:content, ext-box[id="box:content"] {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .uca-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .uca-card:focus-within {
            border-color: rgba(88, 166, 255, 0.35);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(88, 166, 255, 0.15);
        }

        .uca-title {
            margin: 0 0 10px 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.6px;
            color: #ffffff;
        }

        .uca-subtitle {
            margin: 0 0 28px 0;
            font-size: 15px;
            font-weight: 400;
            color: var(--muted-color);
            line-height: 1.5;
        }

        .uca-input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        ext-input, [id^="input:"] {
            flex: 1;
            display: block;
            min-height: 48px;
            padding: 13px 18px;
            background: rgba(10, 12, 16, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            text-align: left;
            outline: none;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        ext-input:empty::before {
            content: attr(placeholder);
            color: #6e7681;
            pointer-events: none;
        }

        ext-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.18);
            background: rgba(14, 17, 23, 0.95);
        }

        ext-action, [id^="action:"] {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            min-width: 48px;
            background: linear-gradient(135deg, #1f6feb 0%, #238636 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
        }

        ext-action[disabled], ext-action.disabled {
            background: #1c2128 !important;
            color: #484f58 !important;
            cursor: not-allowed !important;
            border-color: rgba(255, 255, 255, 0.05) !important;
            box-shadow: none !important;
            pointer-events: none;
        }

        ext-action:not([disabled]):not(.disabled):hover {
            transform: translateY(-1px);
            filter: brightness(1.15);
            box-shadow: 0 6px 18px rgba(35, 134, 54, 0.45);
        }

        ext-action:not([disabled]):not(.disabled):active {
            transform: translateY(0);
        }

        .uca-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted-color);
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.25s ease;
        }

        .uca-status .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #238636;
            box-shadow: 0 0 8px rgba(35, 134, 54, 0.6);
            display: inline-block;
            transition: all 0.25s ease;
        }

        .uca-status.busy .status-dot {
            background: #58a6ff;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.8);
            animation: pulse-dot 1.2s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        #box\:emergent, ext-box[id="box:emergent"] {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 0;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #c9d1d9;
            text-align: left;
        }

        #box\:emergent:empty, ext-box[id="box:emergent"]:empty {
            display: none;
        }

        #box\:footer, ext-box[id="box:footer"] {
            margin-top: auto;
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            font-size: 13px;
            color: #6e7681;
            letter-spacing: 0.2px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(8, 9, 12, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <main id="main" class="uca-main">
        <ext-box id="box:content">
            <div class="uca-card">
                <h1 class="uca-title">Universal Cognitive Architecture</h1>
                <p class="uca-subtitle">¿Qué quieres descubrir o hacer?</p>
                <div class="uca-input-container">
                    <ext-input id="input:query" placeholder="Ej: Ciclo de vida reactivo, bus de señales..." contenteditable="true"></ext-input>
                    <ext-action id="action:submit" title="Descubrir">→</ext-action>
                </div>
                <div id="app:status" class="uca-status">
                    <span class="status-dot"></span>
                    <span id="app:status-text">⚡ Sistema UCA preparado</span>
                </div>
            </div>
            <ext-box id="box:emergent"></ext-box>
        </ext-box>
    </main>
    <ext-box id="box:footer"></ext-box>
    <script type="module" src="app.js"></script>
</body>
</html>
