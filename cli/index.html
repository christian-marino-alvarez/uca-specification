<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Cognitive Architecture (UCA)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        window.process = window.process || { env: {} };
        window.process.env.GEMINI_API_KEY = "{{GEMINI_API_KEY}}";
        window.process.env.OPENAI_API_KEY = "{{OPENAI_API_KEY}}";
        window.process.env.JEV_API_KEY = "{{JEV_API_KEY}}";
        window.process.env.TYPESAFE_API_KEY = "{{JEV_API_KEY}}";
        if (typeof localStorage !== 'undefined') {
            if ("{{GEMINI_API_KEY}}") localStorage.setItem('GEMINI_API_KEY', "{{GEMINI_API_KEY}}");
            if ("{{OPENAI_API_KEY}}") localStorage.setItem('OPENAI_API_KEY', "{{OPENAI_API_KEY}}");
            if ("{{JEV_API_KEY}}") localStorage.setItem('JEV_API_KEY', "{{JEV_API_KEY}}");
        }
    </script>
    <script type="importmap">
{{IMPORT_MAP}}
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
