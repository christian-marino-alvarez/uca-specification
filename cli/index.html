<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCA — Universal Cognitive Architecture</title>
    <meta name="description" content="UCA is a reactive, fractal, and deterministic cognitive architecture for building autonomous agents from composable primitives.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="importmap">
{{IMPORT_MAP}}
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #090d16;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 2rem;
            text-align: center;
        }
        [hidden],
        ext-box#explanation-card:empty,
        ext-list#ontological-pillars:empty,
        ext-action#simulate-pulse:empty,
        ext-toggle#reactive-mode:empty {
            display: none !important;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
            50% { opacity: 0.6; transform: scale(0.98); filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2)); }
        }
        .loading {
            animation: pulseGlow 1.8s ease-in-out infinite;
        }
        ext-box#center-container {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            transition: all 0.3s ease;
        }
        ext-action#query-button {
            display: inline-block;
            padding: 0.9rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
            transition: all 0.2s ease;
            -webkit-user-select: none;
            user-select: none;
        }
        ext-action#query-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6);
        }
        ext-action#query-button:active {
            transform: translateY(0);
        }
        ext-box#explanation-card {
            display: block;
            max-width: 860px;
            width: 100%;
            margin-top: 2rem;
            padding: 2rem 2.5rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.12);
            text-align: left;
            line-height: 1.8;
            font-size: 1.05rem;
            white-space: pre-wrap;
            color: #e2e8f0;
            animation: fadeIn 0.5s ease-out;
        }
        ext-list#ontological-pillars {
            display: block;
            max-width: 860px;
            width: 100%;
            margin-top: 1.5rem;
            padding: 2rem 2.5rem;
            background: rgba(15, 23, 42, 0.8);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
            text-align: left;
            line-height: 1.9;
            font-size: 1rem;
            white-space: pre-wrap;
            color: #cbd5e1;
            animation: fadeIn 0.6s ease-out;
        }
        ext-action#simulate-pulse {
            display: inline-block;
            margin-top: 1.8rem;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.5);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-user-select: none;
            user-select: none;
            animation: fadeIn 0.7s ease-out;
        }
        ext-action#simulate-pulse:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px -5px rgba(6, 182, 212, 0.7);
        }
        ext-toggle#reactive-mode {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.55rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <script type="module" src="app.js"></script>
</body>
</html>
