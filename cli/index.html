<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCA — Universal Cognitive Architecture</title>
    <meta name="description" content="UCA is a reactive, fractal, and deterministic cognitive architecture for building autonomous agents from composable primitives.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="importmap">
{{IMPORT_MAP}}
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #090d16;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 2rem;
            text-align: center;
        }
        [hidden] {
            display: none !important;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
            50% { opacity: 0.6; transform: scale(0.98); filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2)); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <script type="module" src="app.js"></script>
</body>
</html>
